<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manage -Made by ARYAN</title>
</head>

<body>
    <h1>My Bookmarks</h1>
    <h2>Primary bookmarks</h2>
    <p><a target="_blank" href="https://www.google.com">Open Google</a></p>
    <p><a target="_blank" href="https://www.facebook.com">Open Facebook</a></p>
    <p><a target="_blank" href="https://www.instagram.com">Open Instagram</a></p>
    <p><a target="_blank" href="https://www.youtube.com">Open Youtube</a></p>
    <p><a target="_blank" href="https://www.quora.com">Open Quora</a></p>
    <p><a target="_blank" href="https://www.codewithharry.com">Open CodeWithHarry</a></p>
    <h2>Secondary bookmarks</h2>
    <p><a target="_blank" href="https://www.w3schools.com">Open W3Schools</a></p>
    <p><a target="_blank" href="https://www.coursera.org">Open Coursera</a></p>
</body>

</html>



<!-- <a href=URL>---</a> is the anchor tag used to open the websites .-->
<!--target="_blank" is used to open the link in new tab -->
<!--<p></p> is used to create a paragraph and separate all links in different lines , but it is not a good practice to use <p></p>-->
<!-- bookmarks are used to save and organize favorite websites -->
<!-- links are used to navigate between different web pages -->
<!-- paragraphs are used to create separate blocks of text -->
<!-- headings are used to create section titles -->
<!-- syntax of anchor tag with blank is <a target="_blank" href="URL">Link Text</a> -->
