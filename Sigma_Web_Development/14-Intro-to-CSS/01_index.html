<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        /* div {
            color: red;
            background-color: yellow;
        } */
        div,
        span {
            color: red;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div>
        Hey I am Aryan and today i am in CSS mood.
    </div>
    <div>
        I am learning CSS and it is fun.
    </div>
    <span>
        I am also good in HTML.
    </span>
</body>

</html>


<!-- div in a style tag is a selector and color: red is a property-value pair and style is the declaration -->
<!-- background-color: yellow is a property-value pair  -->
<!-- CSS stands for Cascading Style Sheets. It is a language used to describe the visual presentation of a web page written in HTML.
      HTML creates the structure of the page,while CSS adds styling to that structure. -->
