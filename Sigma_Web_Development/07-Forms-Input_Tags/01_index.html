<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms-Lets learn it</title>
</head>

<body>
    <h1>Form to apply for internship</h1>
    <form action="/submit" method="post">
    <div>
            <label for="username">Enter your Username:-</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autofocus>
    </div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="submit" value="Submit">
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to our newsletter</label>
        </div>
        <div>
            <label for="comment">Enter your comment</label>
            <br>
            <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
        </div>

        <div>
            <label for="fruits">Choose a fruit:</label>
            <select id="fruits" name="fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="cherry">Cherry</option>
            </select>
        </div>
    </form>
</body>

</html>

<!-- form tag is used to create an HTML form for user input -->
<!-- action="post" is the HTTP method used to submit the form data -->
<!-- label tag is used to define a label for an input element -->
<!-- input tag is used to create an input field for user input -->
<!-- select tag is used to create a dropdown list -->
<!-- option tag is used to define an option in a dropdown list -->
<!-- textarea tag is used to create a multi-line text input field -->
<!-- for attribute links a label to an input element -->
<!-- action → Data kahan bhejna hai -->
<!-- method → Data kaise bhejna hai (GET/POST) -->
<!-- for="username" labe ko id="username" wale input se connect karta hai. -->
