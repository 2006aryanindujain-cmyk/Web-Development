<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Hey i am para</p>
    <a href="https://google.com">Open Google</a>
    <div>I am a block element</div>
    <span>I am an inline element</span>
    <a href="">yes he is inline</a>
</body>

</html>



<!-- <p> is a block element and <a> is an inline element-->
<!--inline elements are those which only take the space of their content-->
<!--block elements are those which take the full width of the page-->
