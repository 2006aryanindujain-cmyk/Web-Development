<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure HTML Media Player</title>
</head>

<body>
    <!-- You are given 12 files(6 audio and 6 video). Design a website using HTML only which shows these 12 files in a grid of 3 rows and 4 columns.
         1.mp3, 2.mp3, 3.mp3, 4.mp3, 5.mp3, 6.mp3, 7.mp4, 8.mp4, 9.mp4, 10.mp4, 11.mp4, 12.mp4-->
    <h2>Pure HTML Media Player (3x4 Grid)</h2>
    <table border="1" cellspacing="0" cellpadding="10">
        <tr>
            <td>
                <audio controls src="02.mp3"></audio>
            </td>
            <td>
                <audio controls src="03.mp3"></audio>
            </td>
            <td>
                <audio controls src="04.mp3"></audio>
            </td>
            <td>
                <audio controls src="05.mp3"></audio>
            </td>
        </tr>
        <tr>
            <td>
                <audio controls src="06.mp3"></audio>
            </td>
            <td>
                <audio controls src="07.mp3"></audio>
            </td>
            <td>
                <video controls width="250" src="08.mp4"></video>
            </td>
            <td>
                <video controls width="250" src="09.mp4"></video>
            </td>
        </tr>
        <tr>
            <td>
                <video controls width="250" src="10.mp4"></video>
            </td>
            <td>
                <video controls width="250" src="11.mp4"></video>
            </td>
            <td>
                <video controls width="250" src="12.mp4"></video>
            </td>
            <td>
                <video controls width="250" src="13.mp4"></video>
            </td>
        </tr>
    </table>

</body>

</html>
