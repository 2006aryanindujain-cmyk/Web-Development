<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1 {
            /*Color Keywords*/
            /* color: darkcyan; */
            /* Hex Color Code */
            /* color: #19b8cd; */
            /* RGB */
            /* color: rgb(39, 210, 216); */
            /* RGBA */
            /* color: rgba(21, 187, 202, 0.58); */
            /* alpha is opacity which range from 0 to 1 */
            /* HSL */
            /* H means Hue and S means Saturation and L means Lightness */
            /* Syntax:- selector{
                                      color:hsl(hue,saturation,lightness);
                                } */
            color: hsl(188, 100%, 15%);
            background-color: rgb(39, 210, 216);
        }
    </style>
</head>

<body>
    <h1>Lets learn about colors</h1>
    <p>
        Color can be represented in:
    <ol>
        <li>Color Keywords</li>
        <li>Hex Color Code</li>
        <li>RGB</li>
        <li>RGBA</li>
        <li>HSL</li>
    </ol>
    </p>
</body>

</html>
