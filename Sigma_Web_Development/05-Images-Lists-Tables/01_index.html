<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="03_style.css">
</head>

<body>
    <img src="02_image.png" width=800" height=400" alt="nature image">
    <br>
    <table>
        <caption>BOSS DETAILS</caption>

        <thead>
            <tr>
                <th>Name</th>
                <th>Designation</th>
                <th>Favourite Language</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>ARYAN</td>
                <td>PROGRAMMER</td>
                <td>Python</td>
                <td>19</td>
            </tr>
            <tr>
                <td colspan="2">AADI</td>
                <td rowspan="2">20</td>
            </tr>
            <tr>
                <td colspan="2">ADITYA</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">AADI</td>
                <td rowspan="2">footer</td>
            </tr>
        </tfoot>
    </table>
    <ul type="square">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol type="a">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
</body>

</html>




<!--img tag is used to add images in HTML page. its syntax is <img src="imagefilename.type">-->
<!--width is used to change the width of the image-->
<!--height is used to change the height of the image-->
<!--alt is used to add alternative text to the image-->
<!--the syntax with width and height is <img src="imagefilename.type" width="width" height="height" alt="alternative text"> -->
<!--the syntax without width and height is <img src="imagefilename.type" alt="alternative text"> -->
<!--table tag is used to add tables in HTML page. its syntax is <table></table> -->
<!--tr tag is used to add rows in table. its syntax is <tr></tr> -->
<!--th tag is used to add heading in table. its syntax is <th></th> -->
<!--td tag is used to add data in table. its syntax is <td></td> -->
<!--colspan is used to merge the cells. its syntax is <td colspan="number of columns"></td>-->
