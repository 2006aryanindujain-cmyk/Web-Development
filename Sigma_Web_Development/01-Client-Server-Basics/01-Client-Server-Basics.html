### 🌐 How a Website Works

<!-- We are the clients/users who access websites through a web browser. -->

<!-- When we enter a website URL, the browser sends a request to the server. -->

<!-- The server processes the request and sends a response back to the browser. -->

<!-- If the response is successful, the browser receives the website's files/data and displays the website to us. -->

<!-- If the server or network cannot provide a valid response, the browser shows an error. -->

### 🎨 Frontend

<!-- Frontend = client-side of an application. -->

<!-- It includes everything the user sees and interacts with directly, such as buttons, text, images, forms and layouts. -->

<!-- Main technologies: HTML, CSS and JavaScript. -->

### ⚙️ Backend

<!-- Backend = server-side of an application. -->

<!-- It handles things happening behind the scenes, such as processing requests, storing/retrieving data and implementing application logic. -->

<!-- The backend communicates with the frontend through requests and responses. -->
